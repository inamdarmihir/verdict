[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verdict-agents"
version = "0.1.0"
description = "A working risk classifier for agentic software factories — escalate when stop conditions cannot measure what matters."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Mihir Inamdar" },
]
keywords = [
  "agents",
  "langgraph",
  "risk-classifier",
  "human-in-the-loop",
  "verifiability",
  "qdrant",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "qdrant-client>=1.18.0",
  "agno>=2.8.6",
  "mem0ai>=3.0.0",
  "deepagents",
]

[project.optional-dependencies]
langgraph = [
  "langgraph>=1.2.10",
  "langchain-openai>=1.4.0",
  "langchain-core>=1.5.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "langgraph>=1.0.0",
  "langchain-openai>=1.0.0",
  "langchain-core>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/inamdarmihir/verdict"
Documentation = "https://github.com/inamdarmihir/verdict#readme"
Design = "https://github.com/inamdarmihir/verdict/blob/main/docs/DESIGN.md"
Issues = "https://github.com/inamdarmihir/verdict/issues"

[project.scripts]
verdict = "verdict.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["verdict"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["verdict", "tests", "examples"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"examples/**" = ["B008", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["verdict"]
mypy_path = "."
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "qdrant_client.*",
  "langgraph.*",
  "langchain_core.*",
]
ignore_missing_imports = true
